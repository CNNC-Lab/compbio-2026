# Route B — driving biophysical circuits with the data, and training them.
#
# Separate from environment.yml on purpose. The JAX stack is large, pins its own
# numpy, and none of it is needed for routes A or C. Students doing the analysis
# project should not pay for it.
#
#   conda env create -f environment-routeb.yml
#   conda activate compbio-2026-routeb
#
# CPU only. Everything in notebooks 08 to 10 runs in seconds to minutes on a
# laptop; a GPU buys you bigger networks, not a different experience.
name: compbio-2026-routeb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # shared with the main environment: the data still has to be loaded and binned
  - numpy>=1.26
  - scipy>=1.12
  - pandas>=2.2
  - scikit-learn>=1.4
  - pytables>=3.9
  - h5py>=3.10
  - matplotlib>=3.8
  - jupyterlab>=4.0
  - ipykernel
  - ipywidgets
  - tqdm>=4.66
  - pip:
      # differentiable simulation
      - jax[cpu]>=0.4
      - jaxley>=0.14
      - optax>=0.2
      # this repository's own package
      - -e .
